<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NaijaBizHub - Discover Local Businesses</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7f6;
  color:#17211b
}
header{
  background:#071b35;
  color:white;
  padding:15px 20px;
  position:sticky;
  top:0;
  z-index:10
}
.nav{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:20px;
  flex-wrap:wrap
}
.logo{
  font-size:24px;
  font-weight:bold;
  margin-right:auto
}
.logo span{color:#f5b942}
nav button{
  background:none;
  border:0;
  color:white;
  padding:8px;
  font-size:15px;
  cursor:pointer
}
.container{
  max-width:1100px;
  margin:auto;
  padding:25px 20px
}
.hero{
  background:#087443;
  color:white;
  padding:55px 25px;
  text-align:center
}
.hero h1{font-size:38px;margin:10px 0}
.search{
  max-width:650px;
  margin:20px auto;
  display:flex;
  gap:10px
}
.search input{
  flex:1;
  padding:14px;
  border:0;
  border-radius:10px;
  font-size:16px
}
.btn{
  border:0;
  border-radius:10px;
  padding:13px 18px;
  font-weight:bold;
  cursor:pointer
}
.primary{
  background:#f5b942;
  color:#071b35
}
.section{padding:30px 20px}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:18px
}
.card{
  background:white;
  border-radius:12px;
  padding:20px;
  box-shadow:0 2px 10px #0001
}
.card h3{margin-top:0}
.muted{color:#66736c}
.form{
  max-width:700px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:12px;
  box-shadow:0 2px 10px #0001
}
.field{margin-bottom:15px}
.field label{
  display:block;
  margin-bottom:6px;
  font-weight:bold
}
.field input,
.field textarea,
.field select{
  width:100%;
  padding:12px;
  border:1px solid #ccd5d0;
  border-radius:8px;
  font-size:15px
}
.field textarea{min-height:100px}
.screen{display:none}
.screen.active{display:block}
.message{
  margin:15px 0;
  padding:12px;
  border-radius:8px;
  background:#e8f5ed
}
footer{
  background:#071b35;
  color:white;
  text-align:center;
  padding:25px;
  margin-top:30px
}
@media(max-width:600px){
  .hero h1{font-size:28px}
  .search{flex-direction:column}
}
</style>
</head>

<body>

<header>
  <div class="nav">
    <div class="logo">Naija<span>BizHub</span></div>

    <nav>
      <button onclick="showPage('home')">Home</button>
      <button onclick="showPage('businesses')">Businesses</button>
      <button onclick="showPage('register')">Register Business</button>
    </nav>
  </div>
</header>


<!-- HOME -->
<section id="home" class="screen active">

  <div class="hero">
    <h1>Find Trusted Businesses Near You</h1>
    <p>Discover businesses and services across Nigeria.</p>

    <div class="search">
      <input
        id="homeSearch"
        placeholder="Search for a business..."
        oninput="searchBusinesses(this.value)"
      >
    </div>
  </div>

  <div class="container section">
    <h2>Businesses on NaijaBizHub</h2>
    <div id="homeBusinesses" class="grid">
      <p class="muted">Loading businesses...</p>
    </div>
  </div>

</section>


<!-- BUSINESSES -->
<section id="businesses" class="screen">

  <div class="container">

    <h1>Browse Businesses</h1>

    <div class="search">
      <input
        id="businessSearch"
        placeholder="Search businesses, category or city..."
        oninput="searchBusinesses(this.value)"
      >
    </div>

    <div id="businessList" class="grid">
      <p class="muted">Loading businesses...</p>
    </div>

  </div>

</section>


<!-- REGISTER -->
<section id="register" class="screen">

  <div class="container">

    <h1>Register Your Business</h1>

    <div class="form">

      <div id="message"></div>

      <div class="field">
        <label>Business Name *</label>
        <input id="name" placeholder="e.g. Naija Kitchen">
      </div>

      <div class="field">
        <label>Category *</label>
        <select id="category">
          <option value="">Select category</option>
          <option>Restaurant</option>
          <option>Hotel</option>
          <option>Fashion</option>
          <option>Beauty</option>
          <option>Supermarket</option>
          <option>Electronics</option>
          <option>Automobile</option>
          <option>Construction</option>
          <option>Education</option>
          <option>Health</option>
          <option>Technology</option>
          <option>Other</option>
        </select>
      </div>

      <div class="field">
        <label>Description</label>
        <textarea id="description"
          placeholder="Tell customers about your business"></textarea>
      </div>

      <div class="field">
        <label>Address</label>
        <input id="address" placeholder="Business address">
      </div>

      <div class="field">
        <label>Phone</label>
        <input id="phone" placeholder="Phone number">
      </div>

      <div class="field">
        <label>Email</label>
        <input id="email" type="email" placeholder="Business email">
      </div>

      <div class="field">
        <label>Website</label>
        <input id="website" placeholder="https://example.com">
      </div>

      <div class="field">
        <label>City *</label>
        <input id="city" placeholder="e.g. Owerri">
      </div>

      <div class="field">
        <label>State *</label>
        <input id="state" placeholder="e.g. Imo State">
      </div>

      <button class="btn primary" onclick="registerBusiness()">
        Register Business
      </button>

    </div>
  </div>

</section>


<footer>
  <p>© 2026 NaijaBizHub</p>
  <p>Discover. Connect. Grow.</p>
</footer>


<script>

/* SUPABASE CONNECTION */

const SUPABASE_URL =
"https://doflapkovhfudybflhgx.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRvZmxhcGtvdmhmdWR5YmZsaGd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMjI2MzksImV4cCI6MjEwMTY5ODYzOX0.P-KtWFtcgxxtUIkEtAdZkbTFAC3Oio623pIwHmkvFZY";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* PAGE NAVIGATION */

function showPage(page){

  document.querySelectorAll(".screen")
    .forEach(x => x.classList.remove("active"));

  document.getElementById(page)
    .classList.add("active");

  if(page === "businesses"){
    loadBusinesses();
  }

}


/* LOAD BUSINESSES */

let allBusinesses = [];

async function loadBusinesses(){

  const { data, error } = await db
    .from("Business")
    .select("*")
    .order("created_at", {ascending:false});

  if(error){

    console.error(error);

    document.getElementById("businessList").innerHTML =
      "<p>Unable to load businesses.</p>";

    return;
  }

  allBusinesses = data || [];

  displayBusinesses(allBusinesses);

  displayHomeBusinesses(allBusinesses);
}


/* DISPLAY BUSINESS CARDS */

function businessCard(b){

  return `
    <div class="card">

      <h3>${escapeHTML(b.name || "Unnamed Business")}</h3>

      <p><strong>${escapeHTML(b.category || "")}</strong></p>

      <p>${escapeHTML(b.description || "No description available.")}</p>

      <p class="muted">
        📍 ${escapeHTML(b.city || "")},
        ${escapeHTML(b.state || "")}
      </p>

      ${
        b.phone
        ? `<p>📞 ${escapeHTML(b.phone)}</p>`
        : ""
      }

      ${
        b.email
        ? `<p>✉️ ${escapeHTML(b.email)}</p>`
        : ""
      }

      ${
        b.website
        ? `<p>
          <a href="${escapeHTML(b.website)}" target="_blank">
          Visit website
          </a>
        </p>`
        : ""
      }

      ${
        b.is_verified
        ? `<p>✅ Verified Business</p>`
        : ""
      }

    </div>
  `;
}


function displayBusinesses(list){

  const box = document.getElementById("businessList");

  if(!list.length){

    box.innerHTML =
      "<p class='muted'>No businesses found yet.</p>";

    return;
  }

  box.innerHTML =
    list.map(businessCard).join("");
}


function displayHomeBusinesses(list){

  const box = document.getElementById("homeBusinesses");

  const latest = list.slice(0,6);

  if(!latest.length){

    box.innerHTML =
      "<p class='muted'>No businesses registered yet.</p>";

    return;
  }

  box.innerHTML =
    latest.map(businessCard).join("");
}


/* SEARCH */

function searchBusinesses(term){

  term = term.toLowerCase().trim();

  const results = allBusinesses.filter(b => {

    return (
      (b.name || "").toLowerCase().includes(term) ||
      (b.category || "").toLowerCase().includes(term) ||
      (b.city || "").toLowerCase().includes(term) ||
      (b.state || "").toLowerCase().includes(term)
    );

  });

  displayBusinesses(results);
}


/* REGISTER BUSINESS */

async function registerBusiness(){

  const message = document.getElementById("message");

  const business = {

    name: document.getElementById("name").value.trim(),

    category:
      document.getElementById("category").value.trim(),

    description:
      document.getElementById("description").value.trim(),

    address:
      document.getElementById("address").value.trim(),

    phone:
      document.getElementById("phone").value.trim(),

    email:
      document.getElementById("email").value.trim(),

    website:
      document.getElementById("website").value.trim(),

    city:
      document.getElementById("city").value.trim(),

    state:
      document.getElementById("state").value.trim(),

    is_verified:false

  };


  if(!business.name ||
     !business.category ||
     !business.city ||
     !business.state){

    message.innerHTML =
      "<div class='message'>Please fill in the required fields.</div>";

    return;
  }


  message.innerHTML =
    "<div class='message'>Registering business...</div>";


  const { data, error } = await db
    .from("Business")
    .insert([business])
    .select();


  if(error){

    console.error(error);

    message.innerHTML =
      "<div class='message'>Error: " +
      escapeHTML(error.message) +
      "</div>";

    return;
  }


  message.innerHTML =
    "<div class='message'>✅ Business registered successfully!</div>";


  document.getElementById("name").value="";
  document.getElementById("category").value="";
  document.getElementById("description").value="";
  document.getElementById("address").value="";
  document.getElementById("phone").value="";
  document.getElementById("email").value="";
  document.getElementById("website").value="";
  document.getElementById("city").value="";
  document.getElementById("state").value="";


  loadBusinesses();.from("Business")

}


/* SECURITY */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* START */

loadBusinesses();

</script>

</body>
</html>
